<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - Full-Size Image Viewer</title>
  <meta name="description" content="View and download full-resolution image extracted from web source.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    .viewer-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }
    .viewer-topbar {
      height: 60px;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--card-bg);
    }
    .viewer-title-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }
    .viewer-title {
      font-size: 0.875rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 380px;
    }
    .viewer-badge {
      font-size: 0.6875rem;
      font-family: var(--font-mono);
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      background-color: var(--bg-hover);
      border: 1px solid var(--border-color);
    }
    .viewer-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .viewer-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: auto;
      background-image: 
        linear-gradient(45deg, rgba(128,128,128,0.06) 25%, transparent 25%), 
        linear-gradient(-45deg, rgba(128,128,128,0.06) 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, rgba(128,128,128,0.06) 75%), 
        linear-gradient(-45deg, transparent 75%, rgba(128,128,128,0.06) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    .viewer-stage img {
      max-width: 100%;
      max-height: calc(100vh - 160px);
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
    }
    .viewer-infobar {
      padding: 0.875rem 1.5rem;
      border-top: 1px solid var(--border-color);
      background-color: var(--card-bg);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.75rem;
    }
    .viewer-meta-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      font-family: var(--font-mono);
    }
    .viewer-links {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .viewer-link {
      color: var(--brand-blue);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }
    .viewer-link:hover {
      text-decoration: underline;
    }
  </style>
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('theme');
        const darkQuery = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && darkQuery)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="theme-body">
  <div class="viewer-layout">
    <!-- Top Bar -->
    <header class="viewer-topbar">
      <div class="viewer-title-group">
        <a href="/" class="brand-wordmark" style="font-size: 0.875rem;">
          <svg class="brand-icon" style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <span>FullRes Scraper</span>
        </a>
        <span style="color: var(--border-color);">/</span>
        <span class="viewer-title" title="{{ title }}">{{ title }}</span>
        <span id="tierBadge" class="viewer-badge">PROBING</span>
      </div>

      <div class="viewer-actions">
        <button id="zoomToggleBtn" class="btn-secondary" style="padding: 0.4rem 0.75rem; font-size: 0.75rem;">Zoom 100%</button>
        <button id="copyUrlBtn" class="btn-secondary" style="padding: 0.4rem 0.75rem; font-size: 0.75rem;">Copy Link</button>
        <a id="downloadBtn" href="/api/download-file?url={{ image_url | urlencode }}&filename={{ title | urlencode }}&referer={{ (source_page or linked_page or image_url) | urlencode }}" class="btn-primary" style="padding: 0.4rem 0.85rem; font-size: 0.75rem;">Download Master</a>
      </div>
    </header>

    <!-- Center Image Stage -->
    <main class="viewer-stage" id="stageContainer">
      <img id="masterImage" src="{{ image_url }}" alt="{{ title }}" referrerpolicy="no-referrer">
    </main>

    <!-- Bottom Metadata Bar -->
    <footer class="viewer-infobar">
      <div class="viewer-meta-list">
        <span id="metaDimensions">Dimensions: Measuring...</span>
        <span>·</span>
        <span id="metaAspect">Aspect: ...</span>
        <span>·</span>
        <span id="metaFormat">Format: ...</span>
        <span>·</span>
        <span>Original Master Resolution</span>
      </div>

      <div class="viewer-links">
        {% if linked_page %}
        <a href="{{ linked_page }}" target="_blank" rel="noopener" class="viewer-link">
          Linked Detail Page ↗
        </a>
        {% endif %}
        {% if source_page %}
        <a href="{{ source_page }}" target="_blank" rel="noopener" class="viewer-link">
          Source Webpage ↗
        </a>
        {% endif %}
        <a href="{{ image_url }}" target="_blank" rel="noopener" class="viewer-link">
          Direct Image URL ↗
        </a>
      </div>
    </footer>
  </div>

  <script>
    const img = document.getElementById('masterImage');
    const metaDimensions = document.getElementById('metaDimensions');
    const metaAspect = document.getElementById('metaAspect');
    const metaFormat = document.getElementById('metaFormat');
    const tierBadge = document.getElementById('tierBadge');
    const zoomBtn = document.getElementById('zoomToggleBtn');
    const copyBtn = document.getElementById('copyUrlBtn');

    let isZoomed = false;

    img.addEventListener('load', () => {
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      metaDimensions.textContent = `Dimensions: ${w} × ${h} px`;

      const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
      const div = gcd(w, h);
      metaAspect.textContent = `Aspect: ${Math.round((w/h)*100)/100}:1 (${w/div}:${h/div})`;

      const urlClean = img.src.split('?')[0].toLowerCase();
      let format = 'JPG';
      ['png', 'webp', 'avif', 'gif', 'svg'].forEach(fmt => {
        if (urlClean.endsWith('.' + fmt)) format = fmt.toUpperCase();
      });
      metaFormat.textContent = `Format: ${format}`;

      const maxDim = Math.max(w, h);
      if (maxDim >= 3840) {
        tierBadge.textContent = '4K ULTRA HD';
        tierBadge.style.color = '#10b981';
      } else if (maxDim >= 1920) {
        tierBadge.textContent = 'FULL HD';
        tierBadge.style.color = '#3b82f6';
      } else if (maxDim >= 800) {
        tierBadge.textContent = 'HI-RES';
        tierBadge.style.color = '#8b5cf6';
      } else {
        tierBadge.textContent = 'STANDARD';
      }
    });

    zoomBtn.addEventListener('click', () => {
      isZoomed = !isZoomed;
      if (isZoomed) {
        img.style.maxHeight = 'none';
        img.style.maxWidth = 'none';
        img.style.cursor = 'zoom-out';
        zoomBtn.textContent = 'Fit Window';
      } else {
        img.style.maxHeight = 'calc(100vh - 160px)';
        img.style.maxWidth = '100%';
        img.style.cursor = 'zoom-in';
        zoomBtn.textContent = 'Zoom 100%';
      }
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(img.src).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy Link'; }, 1500);
      });
    });
  </script>
</body>
</html>
